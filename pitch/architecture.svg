<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 548" width="100%" role="img" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>「流动的书」系统架构</title>
  <desc>访客与管理员经 Caddy 反代进入零依赖 Node 服务，数据存于 SQLite，共享数据与按 user_id 隔离数据分开，后台接入微信读书同步、AI 解读层与自动备份。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">「流动的书」系统架构</text>

  <g>
    <rect x="150" y="50" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="235" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">访客 · 默认进入</text>
    <text x="235" y="90" text-anchor="middle" font-size="12" fill="#5F5E5A">免密 · 每人一个 user_id</text>
  </g>
  <g>
    <rect x="360" y="50" width="170" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
    <text x="445" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">管理员 · 站点口令</text>
    <text x="445" y="90" text-anchor="middle" font-size="12" fill="#5F5E5A">同步 / 备份 / 管理</text>
  </g>

  <line x1="235" y1="106" x2="235" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="106" x2="445" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="142" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="164" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Caddy 反代 · :8899</text>

  <line x1="340" y1="186" x2="340" y2="208" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="210" width="380" height="72" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Node.js 服务 · 零第三方依赖</text>
  <text x="340" y="254" text-anchor="middle" font-size="12" fill="#5F5E5A">resolveIdentity：owner_session / guest_id → user_id</text>
  <text x="340" y="272" text-anchor="middle" font-size="12" fill="#5F5E5A">全部读写按 user_id 隔离 · 管理操作需 owner</text>

  <line x1="230" y1="282" x2="230" y2="328" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="282" x2="538" y2="328" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="380" height="176" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="230" y="352" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">SQLite 数据层 · data/reading.db</text>
  <rect x="64" y="368" width="332" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="230" y="388" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">共享数据</text>
  <text x="230" y="406" text-anchor="middle" font-size="12" fill="#5F5E5A">书籍 · 划线 · 主题 · 每日推荐</text>
  <rect x="64" y="436" width="332" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="230" y="456" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">按 user_id 隔离</text>
  <text x="230" y="474" text-anchor="middle" font-size="12" fill="#5F5E5A">感悟 · 收藏 · 喜欢 · 复习 · 打卡</text>

  <rect x="440" y="330" width="200" height="176" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="540" y="352" text-anchor="middle" font-size="13" font-weight="500" fill="#854F0B">外部 / 后台服务</text>
  <rect x="456" y="366" width="168" height="40" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="540" y="386" text-anchor="middle" font-size="12" font-weight="500" fill="#854F0B" dominant-baseline="central">微信读书网关</text>
  <rect x="456" y="414" width="168" height="40" rx="8" fill="#FFF7EA" stroke="#BA7517" stroke-width="1"/>
  <text x="540" y="428" text-anchor="middle" font-size="12" font-weight="500" fill="#854F0B" dominant-baseline="central">AI 解读层</text>
  <text x="540" y="444" text-anchor="middle" font-size="10" fill="#854F0B" dominant-baseline="central">大模型 / 模板兜底</text>
  <rect x="456" y="462" width="168" height="40" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="540" y="482" text-anchor="middle" font-size="12" font-weight="500" fill="#854F0B" dominant-baseline="central">自动备份</text>

  <text x="340" y="524" text-anchor="middle" font-size="12" fill="#888780">访客默认免密进入 · 交互数据每人隔离 · 管理操作需站点口令</text>
</svg>
